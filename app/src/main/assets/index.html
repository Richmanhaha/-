<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>行情</title>
<style>
:root{--bg:#fff;--card:#f4f5f7;--tx:#111;--mu:#8a8f98;--up:#0a9d58;--dn:#e5484d;--ln:#e6e8ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f12;--card:#181a1f;--tx:#f2f3f5;--mu:#7b818c;--ln:#262930}}
:root[data-theme="dark"]{--bg:#0e0f12;--card:#181a1f;--tx:#f2f3f5;--mu:#7b818c;--ln:#262930}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;max-width:560px;padding:0 16px 40px}
.up{color:var(--up)}.dn{color:var(--dn)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px}
h1{font-size:24px;margin:0}
button{font-family:inherit}
.btns button{background:var(--card);color:var(--tx);border:0;border-radius:16px;padding:6px 12px;margin-left:6px;font-size:13px}
.idx{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px}
.ic{flex:0 0 auto;min-width:118px;background:var(--card);border-radius:12px;padding:10px 12px}
.ic small{color:var(--mu)}.ic b{display:block;font-size:16px}
.pf{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:6px}.pf small{color:var(--mu);display:block}.pf b{font-size:22px}.pf span{font-size:13px;margin-left:10px}
.row{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.nm{flex:1;min-width:0}.nm b{display:block}.nm small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{width:64px;height:28px;margin:0 8px}
.pr{text-align:right;width:84px}.pr b{font-variant-numeric:tabular-nums}.pr small{display:block;color:var(--mu);font-size:11px}
.chg{display:inline-block;min-width:66px;text-align:center;border-radius:6px;padding:3px 0;color:#fff;font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums;background:var(--mu)}
.chg.up{background:var(--up)}.chg.dn{background:var(--dn)}
.note{color:var(--mu);font-size:12px;text-align:center;margin-top:16px}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 30px;display:none;z-index:5}
.ov.on{display:block}.ov>div{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{background:none;border:0;color:var(--tx);font-size:15px;padding:6px 0}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;background:var(--card);color:var(--mu);border:0;border-radius:8px;padding:7px 0;font-size:13px}
.tabs button.on{background:var(--tx);color:var(--bg)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.st>*{background:var(--card);border-radius:10px;padding:10px}.st small{color:var(--mu);display:block}
.add{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.add button{background:var(--tx);color:var(--bg);border:0;border-radius:14px;padding:5px 14px}
input{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;font-size:16px}
svg{display:block;touch-action:pan-y}
</style></head><body>
<header><h1>行情</h1><div class="btns"><button id="bAdd">＋ 添加</button><button id="bCol">涨跌色</button><button id="bTh">主题</button></div></header>
<div id="bn" style="display:none;background:var(--up);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px" onclick="this.style.display='none'"></div><div class="idx" id="idx"></div><div id="pf"></div><div id="list"></div>
<p class="note" id="stt">加载中…</p>
<p class="note">行情来自 Yahoo Finance，可能延迟，仅供参考，不构成投资建议。</p>
<div class="ov" id="det"><div></div></div>
<div class="ov" id="adv"><div><div class="top"><b style="font-size:18px">添加自选</b><button id="cl2">完成</button></div><input id="sq" placeholder="搜索代码或名称，如 AAPL、特斯拉、SPY" style="margin:10px 0"><div id="al"></div></div></div>
<script>
var IDX=['^GSPC','^IXIC','^DJI','^VIX'],IN={'^GSPC':'标普500','^IXIC':'纳斯达克','^DJI':'道琼斯','^VIX':'VIX 恐慌指数'};
var R={'1日':'1d','1周':'5d','1月':'1mo','3月':'3mo','1年':'1y'};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var W=ld('w',['AAPL','MSFT','NVDA','GOOGL','AMZN','META','TSLA','SPY','QQQ']),H=ld('h',{}),flip=ld('f',false),sel=null,rg='1日',S={},D={},NM=ld('n',{}),A=ld('a',{});
function $(i){return document.getElementById(i)}
function syms(){var a=IDX.concat(W);Object.keys(A).forEach(function(s){if(a.indexOf(s)<0)a.push(s)});Object.keys(H).forEach(function(s){if(H[s]&&H[s].n>0&&a.indexOf(s)<0)a.push(s)});return a}
function nm(s){return IN[s]||NM[s]||(S[s]&&S[s].name)||s}
function cl(v){return(v>=0)!=flip?'up':'dn'}
function fm(v){return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sg(v){return(v>=0?'+':'')+fm(v)}
function path(a,w,h,pad){var mn=Math.min.apply(0,a),mx=Math.max.apply(0,a),d=mx-mn||1;return a.map(function(v,i){return(i?'L':'M')+(i/(a.length-1||1)*w).toFixed(1)+' '+(pad+(1-(v-mn)/d)*(h-2*pad)).toFixed(1)}).join('')}
function chk(){Object.keys(A).forEach(function(s){var a=A[s],x=S[s];if(!x)return;if(a.d=='up'?x.p>=a.t:x.p<=a.t){delete A[s];sv('a',A);var m=s+' 已'+(a.d=='up'?'涨到':'跌到')+' '+fm(x.p)+'（提醒价 '+fm(a.t)+'）';$('bn').textContent=m;$('bn').style.display='block';try{if(window.Notification&&Notification.permission=='granted')new Notification('价格提醒',{body:m})}catch(e){}}})}
function load(){
 api('/api/quotes?s='+encodeURIComponent(syms().join(','))).then(function(r){return r.json()}).then(function(j){
  Object.keys(j).forEach(function(k){if(j[k]&&j[k].p!=null)S[k]=j[k]});chk();
  $('stt').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN')+'（每 10 秒刷新）';ui()
 }).catch(function(){$('stt').textContent='连接失败，稍后自动重试'})}
function ui(){if(document.activeElement&&document.activeElement.tagName=='INPUT')return;var y=window.scrollY;render();window.scrollTo(0,y);if(sel)loadChart()}
function render(){
 $('idx').innerHTML=IDX.map(function(s){var x=S[s];if(!x)return'<div class="ic"><small>'+IN[s]+'</small><b>—</b></div>';var c=(x.p/x.o-1)*100;return'<div class="ic" data-s="'+s+'"><small>'+IN[s]+'</small><b>'+fm(x.p)+'</b><span class="'+cl(c)+'">'+sg(c)+'%</span></div>'}).join('');
 var t={};Object.keys(H).forEach(function(s){var h=H[s],x=S[s];if(h&&h.n>0&&x){var q=t[x.cur]||(t[x.cur]={v:0,p:0,d:0});q.v+=h.n*x.p;q.p+=h.n*(x.p-(h.c||x.p));q.d+=h.n*(x.p-x.o)}});
 $('pf').innerHTML=Object.keys(t).map(function(k){var q=t[k];return'<div class="pf"><small>持仓市值（'+k+'）</small><b>'+fm(q.v)+'</b><span class="'+cl(q.d)+'">今日 '+sg(q.d)+'</span><span class="'+cl(q.p)+'">累计 '+sg(q.p)+'</span></div>'}).join('');
 $('list').innerHTML=W.length?W.map(function(s){var x=S[s];if(!x)return'<div class="row" data-s="'+s+'"><div class="nm"><b>'+s+'</b><small>'+nm(s)+'</small></div><div class="pr"><b>—</b></div><span class="chg">—</span></div>';
  var c=(x.p/x.o-1)*100,k=cl(c)=='up'?'var(--up)':'var(--dn)';
  return'<div class="row" data-s="'+s+'"><div class="nm"><b>'+s+'</b><small>'+nm(s)+'</small></div><svg class="sp" viewBox="0 0 64 28"><path d="'+path(x.h&&x.h.length>1?x.h:[0,0],64,28,2)+'" fill="none" stroke="'+k+'" stroke-width="1.5"/></svg><div class="pr"><b>'+fm(x.p)+'</b><small>'+x.cur+'</small></div><span class="chg '+cl(c)+'">'+sg(c)+'%</span></div>'}).join(''):'<p class="note">还没有自选，点右上角“添加”。</p>';
 if(sel)det()}
function loadChart(){var k=sel+rg;if(D[k]&&Date.now()-D[k].at<60000)return;D[k]=D[k]||{at:0};D[k].at=Date.now();
 api('/api/chart?s='+encodeURIComponent(sel)+'&r='+R[rg]).then(function(r){return r.json()}).then(function(j){if(!j.c||!j.c.length)throw 0;D[k]={at:Date.now(),t:j.t,c:j.c};if(sel&&sel+rg==k)det()}).catch(function(){D[k]={at:Date.now(),err:1};if(sel&&sel+rg==k)det()})}
function det(){
 var s=sel,x=S[s],h=H[s]||{},d=D[s+rg],a=d&&d.c;
 if(!x){$('det').firstChild.innerHTML='<div class="top"><button id="bk">‹ 返回</button></div><p class="note">加载中…</p>';return}
 var dd=x.p-x.o,c=(x.p/x.o-1)*100,pl=h.n>0?h.n*(x.p-(h.c||x.p)):0,ch='<p class="note" style="height:190px;line-height:190px">'+(d&&d.err?'图表加载失败':'加载中…')+'</p>',rc=0,hi=0,lo=0,k='var(--mu)';
 if(a){rc=(a[a.length-1]/a[0]-1)*100;hi=Math.max.apply(0,a);lo=Math.min.apply(0,a);k=cl(rc)=='up'?'var(--up)':'var(--dn)';var p=path(a,340,190,8);
  ch='<svg id="ch" viewBox="0 0 340 190" width="100%"><path d="'+p+'L340 190L0 190Z" fill="'+k+'" opacity=".12"/><path d="'+p+'" fill="none" stroke="'+k+'" stroke-width="2"/><line id="cx" y1="0" y2="190" stroke="var(--mu)" opacity="0"/></svg>'}
 $('det').firstChild.innerHTML='<div class="top"><button id="bk">‹ 返回</button><button id="rm">'+(W.indexOf(s)<0?'＋ 自选':'移除自选')+'</button></div><div style="margin-top:6px"><b style="font-size:20px">'+s+'</b> <span style="color:var(--mu)">'+nm(s)+'</span></div><div class="big">'+fm(x.p)+' <small style="font-size:14px;color:var(--mu)">'+x.cur+'</small></div><div class="'+cl(dd)+'">今日 '+sg(dd)+'（'+sg(c)+'%）</div><div style="margin-top:10px">'+ch+'</div><div id="tip" style="color:var(--mu);font-size:12px;height:18px">'+(a?'区间涨跌 <span class="'+cl(rc)+'">'+sg(rc)+'%</span>　触摸图表查看价格':'')+'</div><div class="tabs">'+Object.keys(R).map(function(r){return'<button data-r="'+r+'"'+(r==rg?' class="on"':'')+'>'+r+'</button>'}).join('')+'</div><div class="st" style="grid-template-columns:1fr 1fr 1fr"><label><small>持仓股数</small><input id="hn" type="number" inputmode="decimal" value="'+(h.n||'')+'"></label><label><small>成本价</small><input id="hc" type="number" inputmode="decimal" value="'+(h.c||'')+'"></label><div><small>浮动盈亏</small><b class="'+cl(pl)+'">'+(h.n>0?sg(pl):'—')+'</b></div></div>'+'<div class="st"><label><small>价格提醒（到价通知）</small><input id="ap" type="number" inputmode="decimal" placeholder="输入目标价" value="'+(A[s]?A[s].t:'')+'"></label><button id="ab" style="border:0;border-radius:10px;background:var(--tx);color:var(--bg)">'+(A[s]?'取消提醒':'设置提醒')+'</button></div>'+(a?'<div class="st"><div><small>区间最高</small>'+fm(hi)+'</div><div><small>区间最低</small>'+fm(lo)+'</div><div><small>昨收</small>'+fm(x.o)+'</div><div><small>区间起点</small>'+fm(a[0])+'</div></div>':'');
 var svg=$('ch');if(!svg)return;var cx=$('cx'),tip=$('tip');
 function mv(e){var b=svg.getBoundingClientRect(),i=Math.max(0,Math.min(a.length-1,Math.round((e.clientX-b.left)/b.width*(a.length-1)))),X=i/(a.length-1||1)*340;cx.setAttribute('x1',X);cx.setAttribute('x2',X);cx.setAttribute('opacity',1);tip.textContent=new Date(d.t[i]*1000).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'　'+fm(a[i])}
 svg.onpointermove=mv;svg.onpointerdown=mv;svg.onpointerleave=function(){cx.setAttribute('opacity',0)}}
var tm;function search(){var q=$('sq').value.trim();clearTimeout(tm);if(!q){$('al').innerHTML='';return}
 tm=setTimeout(function(){api('/api/search?q='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(l){
  $('al').innerHTML=l.length?l.map(function(x){return'<div class="add"><span><b>'+x.s+'</b> <small style="color:var(--mu)">'+x.n+' · '+x.e+'</small></span><button data-a="'+x.s+'" data-n="'+x.n.replace(/"/g,'')+'">'+(W.indexOf(x.s)<0?'添加':'已添加')+'</button></div>'}).join(''):'<p class="note">没有找到</p>'}).catch(function(){$('al').innerHTML='<p class="note">搜索失败</p>'})},300)}
document.addEventListener('click',function(e){
 var t=e.target,r=t.closest('[data-s]');
 if(r&&!t.closest('.ov')){sel=r.dataset.s;$('det').classList.add('on');det();loadChart();return}
 if(t.id=='bk'){sel=null;$('det').classList.remove('on')}
 if(t.id=='rm'){var i=W.indexOf(sel);i<0?W.push(sel):W.splice(i,1);sv('w',W);load();render()}
 if(t.dataset.r){rg=t.dataset.r;det();loadChart()}
 if(t.id=='bCol'){flip=!flip;sv('f',flip);render()}
 if(t.id=='bTh'){var h=document.documentElement;h.dataset.theme=getComputedStyle(h).getPropertyValue('--bg').trim()=='#fff'?'dark':'light'}
 if(t.id=='bAdd'){$('adv').classList.add('on');$('sq').focus()}
 if(t.id=='cl2'){$('adv').classList.remove('on')}
 if(t.id=='ab'){if(A[sel])delete A[sel];else{var v=parseFloat($('ap').value),x=S[sel];if(v>0&&x){A[sel]={t:v,d:v>=x.p?'up':'dn'};if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}}sv('a',A);det()}
 if(t.dataset.a&&W.indexOf(t.dataset.a)<0){W.push(t.dataset.a);NM[t.dataset.a]=t.dataset.n;sv('w',W);sv('n',NM);t.textContent='已添加';load()}
});
document.addEventListener('input',function(e){var t=e.target;if(t.id=='sq')search();if(t.id=='hn'||t.id=='hc'){var h=H[sel]||(H[sel]={});h[t.id=='hn'?'n':'c']=parseFloat(t.value)||0;sv('h',H)}});
document.addEventListener('change',function(e){if(e.target.id=='hn'||e.target.id=='hc'){load();render()}});
var cb={},cn=0,CC={};window.__cb=function(id,t){var f=cb[id];delete cb[id];f&&f(t)};
function nget(u){return new Promise(function(res,rej){var id='r'+(++cn);cb[id]=function(t){try{var j=JSON.parse(t);if(j&&j.__err)rej(j.__err);else res(j)}catch(e){rej(e)}};Android.get(u,id)})}
function yget(u,ttl){var c=CC[u];if(c&&Date.now()-c.t<ttl)return Promise.resolve(c.v);return nget(u).then(function(v){CC[u]={t:Date.now(),v:v};return v})}
var RGN={'1d':['1d','5m'],'5d':['5d','30m'],'1mo':['1mo','1d'],'3mo':['3mo','1d'],'1y':['1y','1d']},YB='https://query1.finance.yahoo.com';
function ychart(s,r){var g=RGN[r]||RGN['1d'];return yget(YB+'/v8/finance/chart/'+encodeURIComponent(s)+'?range='+g[0]+'&interval='+g[1],r=='1d'?8000:60000).then(function(j){var x=j.chart&&j.chart.result&&j.chart.result[0];if(!x)throw 0;var ts=x.timestamp||[],q=(x.indicators.quote[0]||{}).close||[],t=[],c=[];for(var i=0;i<ts.length;i++)if(q[i]!=null){t.push(ts[i]);c.push(q[i])}return{meta:x.meta,t:t,c:c}})}
function thin(a,n){if(a.length<=n)return a;var o=[];for(var i=0;i<n;i++)o.push(a[Math.round(i*(a.length-1)/(n-1))]);return o}
function capi(path){var u=new URL(path,'http://x'),p=u.pathname,q=u.searchParams;
 if(p=='/api/quotes'){var l=(q.get('s')||'').split(',').filter(Boolean).slice(0,30),o={};return Promise.all(l.map(function(s){return ychart(s,'1d').then(function(r){var m=r.meta;o[s]={p:m.regularMarketPrice,o:m.chartPreviousClose!=null?m.chartPreviousClose:m.previousClose,cur:m.currency,name:m.shortName||m.longName||s,h:thin(r.c,50)}}).catch(function(){o[s]={err:1}})})).then(function(){return o})}
 if(p=='/api/chart')return ychart(q.get('s'),q.get('r')||'1d').then(function(r){return{t:r.t,c:r.c}});
 if(p=='/api/search')return yget(YB+'/v1/finance/search?q='+encodeURIComponent(q.get('q'))+'&quotesCount=8&newsCount=0',60000).then(function(j){return(j.quotes||[]).filter(function(x){return x.symbol}).map(function(x){return{s:x.symbol,n:x.shortname||x.longname||x.symbol,e:x.exchDisp||''}})});
 return Promise.reject(0)}
function api(p){return window.Android?capi(p).then(function(v){return{json:function(){return v}}}):fetch(p)}
window.__back=function(){if($('adv').classList.contains('on')){$('adv').classList.remove('on');return true}if(sel){sel=null;$('det').classList.remove('on');return true}return false};
load();setInterval(function(){if(!$('adv').classList.contains('on'))load()},10000);
</script></body></html>
